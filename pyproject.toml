[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-flow-ai"
version = "0.1.0"
description = "Extreme-aware AI framework for streamflow prediction and NWM bias correction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# TODO: add author(s), e.g. authors = [{ name = "Your Name", email = "you@example.com" }]

# Core dependencies actually used by the current codebase
# (src/hydro_flow_ai/reconstruct_dataset.py).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Planned for the modeling stage (XGBoost residual-correction baseline).
ml = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
]

# Planned for later roadmap items (Transformer/LSTM, river-network GNN).
dl = [
    "torch>=2.1",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
