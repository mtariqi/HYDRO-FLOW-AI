[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-flow-ai"
version = "0.3.1"
description = "Extreme-aware physics-guided streamflow correction with graph-RAG diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
]
dl = [
    "torch>=2.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
rag = [
    "lightrag-hku>=1.4",
    "raganything>=1.2",
]
workflow = [
    "snakemake>=9.27",
    "snakemake-executor-plugin-slurm>=1.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
hydroflow = "hydroflow_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
